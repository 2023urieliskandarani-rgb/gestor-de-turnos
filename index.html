<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Turnos Hospitalarios</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <i class="fa-solid fa-hospital-user"></i>
      <h1>Gestor de Turnos Hospitalarios</h1>
    </div>
  </header>

  <main class="container">
    
    <!-- SECCIÓN IZQUIERDA: REGISTRO DE TURNO -->
    <section class="form-section">
      <h2><i class="fa-solid fa-calendar-plus"></i> Agendar Nuevo Turno</h2>
      
      <form id="appointmentForm">
        <!-- Paciente -->
        <div class="form-group">
          <label for="patientName">Nombre Completo del Paciente</label>
          <input type="text" id="patientName" placeholder="Ej. Ana García" required>
        </div>

        <!-- Especialidad -->
        <div class="form-group">
          <label for="specialty">Especialidad Médica</label>
          <select id="specialty" required>
            <option value="">Seleccione especialidad...</option>
            <option value="Cardiología">Cardiología</option>
            <option value="Pediatría">Pediatría</option>
            <option value="Traumatología">Traumatología</option>
            <option value="Dermatología">Dermatología</option>
            <option value="Neurología">Neurología</option>
            <option value="Medicina General">Medicina General</option>
          </select>
        </div>

        <!-- Fecha -->
        <div class="form-group">
          <label for="date">Fecha del Turno</label>
          <input type="date" id="date" required>
        </div>

        <!-- Horario -->
        <div class="form-group">
          <label for="time">Horario Asignado (cada 30 min)</label>
          <select id="time" required>
            <option value="">Seleccione horario...</option>
            <!-- Opciones de 30 min pobladas dinámicamente -->
          </select>
        </div>

        <!-- Botón de Guardado -->
        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-floppy-disk"></i> Guardar Turno Asignado
        </button>
      </form>

      <!-- Mensaje de Alerta -->
      <div id="alertBox" class="alert hidden"></div>
    </section>

    <!-- SECCIÓN DERECHA: LISTADO DE TURNOS -->
    <section class="panel-section">
      <div class="panel-header">
        <h2><i class="fa-solid fa-list-check"></i> Turnos Registrados</h2>
        <span class="badge-count" id="totalCount">0 turnos</span>
      </div>

      <!-- Filtro rápido -->
      <div class="filter-box">
        <input type="text" id="searchInput" placeholder="Buscar por nombre de paciente...">
      </div>

      <!-- Lista de Turnos -->
      <div class="appointments-list" id="appointmentsList">
        <div class="empty-state">
          <i class="fa-regular fa-calendar-xmark"></i>
          <p>No hay turnos agendados aún.</p>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
